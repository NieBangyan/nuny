<!DOCTYPE html><html lang="zh" xmlns:th="http://www.thymeleaf.org"><head><th:block th:include="include :: header('课堂练习记录')"/></head><body class="white-bg"><div class="wrapper wrapper-content"><form id="recordForm" class="form-horizontal" th:object="${studentPracticeRecords}">
<input type="hidden" name="id" th:value="*{id}"><div class="form-group"><label class="col-sm-3 control-label">学生姓名：</label><div class="col-sm-8"><input class="form-control" name="studentName" maxlength="50" required th:value="*{studentName}"><p class="help-block">姓名与首页名册一致时自动关联排号。</p></div></div><div class="form-group"><label class="col-sm-3 control-label">第几排：</label><div class="col-sm-8"><input type="number" min="1" max="100" name="seatRow" class="form-control" th:value="*{seatRow}"></div></div><div class="form-group"><label class="col-sm-3 control-label">是否完成：</label><div class="col-sm-8"><select name="isCompleted" class="form-control"><option value="0">未完成</option><option value="1" th:selected="${studentPracticeRecords.isCompleted == 1}">已完成</option></select></div></div><div class="form-group"><label class="col-sm-3 control-label">练习日期：</label><div class="col-sm-8"><input type="date" name="practiceDate" class="form-control" required th:value="*{#dates.format(practiceDate, 'yyyy-MM-dd')}"></div></div><div class="form-group"><label class="col-sm-3 control-label">备注：</label><div class="col-sm-8"><textarea name="remark" class="form-control" maxlength="500" th:text="*{remark}"></textarea></div></div></form></div><th:block th:include="include :: footer"/><script>
function submitHandler(){if(document.getElementById('recordForm').reportValidity())$.operate.save(ctx+'system/records/view',$('#recordForm').serialize());}
document.querySelectorAll('#recordForm input,#recordForm select,#recordForm textarea').forEach(function(e){e.disabled=true;}); function submitHandler(){$.modal.close();}
</script></body></html>
