<!DOCTYPE html><html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro"><head><th:block th:include="include :: header('课堂练习记录')"/></head><body class="gray-bg"><div class="container-div"><div class="row"><div class="col-sm-12 search-collapse"><form id="records-form"><div class="select-list"><ul><li>学生姓名：<input name="studentName"></li><li>是否完成：<select name="isCompleted"><option value="">所有</option><option value="1">已完成</option><option value="0">未完成</option></select></li><li class="select-time">练习日期：<input type="text" class="time-input" id="startTime" name="params[beginPracticeDate]" placeholder="开始日期"> - <input type="text" class="time-input" id="endTime" name="params[endPracticeDate]" placeholder="结束日期"></li><li><a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()">搜索</a> <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()">重置</a></li></ul></div></form></div><div class="btn-group-sm" id="toolbar"><a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="system:records:add">添加</a> <a class="btn btn-primary single disabled" onclick="$.operate.edit()" shiro:hasPermission="system:records:edit">修改</a> <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="system:records:remove">删除</a> <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="system:records:export">导出</a></div><div class="col-sm-12 select-table table-striped"><table id="bootstrap-table"></table></div></div></div><th:block th:include="include :: footer"/><script th:inline="javascript">
var prefix=ctx+'system/records',editFlag=[[${@permission.hasPermi('system:records:edit')}]],removeFlag=[[${@permission.hasPermi('system:records:remove')}]];
$(function(){
function sharedDate(){var d=localStorage.getItem('classroomDate');if(!d){var now=new Date();d=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');}return d;}
$('#startTime,#endTime').val(sharedDate());
window.addEventListener('storage',function(e){if(e.key==='classroomDate'&&e.newValue){$('#startTime,#endTime').val(e.newValue);$.table.search();}});
window.addEventListener('focus',function(){$.table.search();});
$.table.init({url:prefix+'/list',createUrl:prefix+'/add',updateUrl:prefix+'/edit/{id}',removeUrl:prefix+'/remove',exportUrl:prefix+'/export',autoRefresh:true,autoRefreshInterval:15,modalName:'课堂练习记录',escape:true,columns:[{checkbox:true},{field:'id',visible:false},{field:'studentName',title:'学生姓名'},{field:'seatRow',title:'第几排',formatter:function(v){return v==null?'未分配':v;}},{field:'isCompleted',title:'是否完成',formatter:function(v){return Number(v)===1?'<span class="badge badge-primary">已完成</span>':'<span class="badge">未完成</span>';}},{field:'practiceDate',title:'练习日期'},{field:'remark',title:'备注'},{title:'操作',formatter:function(v,r){return '<a class="btn btn-info btn-xs" onclick="$.modal.open(\'查看记录\',prefix+\'/view/'+r.id+'\')">查看</a> <a class="btn btn-primary btn-xs '+editFlag+'" onclick="$.operate.edit('+r.id+')">编辑</a> <a class="btn btn-danger btn-xs '+removeFlag+'" onclick="$.operate.remove('+r.id+')">删除</a>';}}]});});
</script></body></html>
