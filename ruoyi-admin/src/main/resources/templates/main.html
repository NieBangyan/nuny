<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head><th:block th:include="include :: header('学生课堂练习统计')"/>
<style>
body{background:#f3f6fa;color:#24344a;padding:24px}.report-card{background:white;border-radius:12px;padding:24px;margin-bottom:20px;border:1px solid #e7edf4}h1{font-size:25px;margin:0 0 10px} .muted{color:#7b889a}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:20px}.toolbar input,.toolbar select{padding:8px;border:1px solid #dce3ed;border-radius:5px}.metrics{display:flex;gap:36px;margin-top:24px}.metrics strong{display:block;font-size:28px}.students{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.student{border:1px solid #dce3ed;background:#f5f7fa;border-radius:7px;padding:12px 18px;min-width:110px;color:#536174;text-align:left}.student.done{background:#e3f6eb;color:#18794a;border-color:#a4dfbb}.student small{display:block;margin-top:5px}.row-title{display:flex;justify-content:space-between;align-items:center}.row-title h3{margin:0;font-size:19px}#chart{height:340px}#message{padding:12px 0;color:#a74435}.legend{margin-top:16px}.green{color:#18794a}button:disabled{cursor:default} .empty{text-align:center;padding:48px;color:#7b889a}@media(max-width:600px){body{padding:12px}.report-card{padding:16px}.metrics{gap:20px}}
</style></head>
<body>
<section class="report-card"><h1>学生课堂练习统计</h1><div class="muted">按日期查看每排完成情况，掌握全班练习进度</div>
<form id="filters" class="toolbar"><label for="date">练习日期</label><input type="date" id="date" required><label for="rowFilter">座位排</label><select id="rowFilter"><option value="">全部排</option></select><button class="btn btn-primary" type="submit">查询</button><button class="btn btn-default" type="button" id="chartButton">生成柱状图</button></form>
<div id="message" role="status"></div><div class="metrics"><div><strong id="total">—</strong>学生人数</div><div><strong id="done">—</strong>已完成</div><div><strong id="pending">—</strong>未完成</div><div><strong id="rate">—</strong>完成率</div></div>
<div class="legend"><span class="green">■ 已完成</span>　<span class="muted">■ 未完成（当日有记录）</span>　<span class="muted">各排按完成人数倒序；同人数按排号升序。</span></div></section>
<section class="report-card" shiro:hasPermission="system:records:add"><h3>添加当天课堂练习记录</h3><form id="addStudent" class="toolbar"><label for="name">姓名</label><input id="name" maxlength="50" required placeholder="输入学生姓名"><label for="seatRow">排号</label><input id="seatRow" type="number" min="1" max="100" value="1" required style="width:85px"><button class="btn btn-primary" type="submit">添加记录</button></form><p class="muted" style="margin-top:12px">同名学生请在姓名后添加学号区分。添加后可在下方标记完成状态或调整排号。</p></section>
<section id="chartCard" class="report-card" hidden><h3>各排课堂练习完成统计</h3><div id="chart"></div></section>
<div id="rows"></div>
<th:block th:include="include :: footer"/>
<script th:src="@{/ajax/libs/report/echarts/echarts-all.min.js}"></script>
<script th:inline="javascript">
var ctx=/*[[@{/}]]*/ '/';
var canEdit=false;
</script><script shiro:hasPermission="system:records:edit">canEdit=true;</script>
<script>
(function(){
var data=[],chart=null,loadedDate='',sequence=0;
var today=new Date();$('#date').val(today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0'));
function message(s){$('#message').text(s||'');}
function groups(){var by={};data.forEach(function(s){var r=Number(s.rowNumber);if($('#rowFilter').val()&&r!==Number($('#rowFilter').val()))return;if(!by[r])by[r]={row:r,students:[],done:0};by[r].students.push(s);by[r].done+=Number(s.completed)===1?1:0;});return Object.keys(by).map(function(k){return by[k];}).sort(function(a,b){return b.done-a.done||a.row-b.row;});}
function draw(){var rows=groups();if(!chart)chart=echarts.init(document.getElementById('chart'));chart.setOption({tooltip:{trigger:'axis'},legend:{data:['已完成','未完成']},grid:{x:45,y:45,x2:20,y2:65},xAxis:[{type:'category',data:rows.map(function(r){return '第'+r.row+'排';})}],yAxis:[{type:'value',min:0,precision:0}],series:[{name:'已完成',type:'bar',itemStyle:{normal:{color:'#37b777'}},data:rows.map(function(r){return r.done;})},{name:'未完成',type:'bar',itemStyle:{normal:{color:'#cbd5e1'}},data:rows.map(function(r){return r.students.length-r.done;})}]},true);}
function write(path,payload){return $.ajax({url:ctx+'system/classroom/'+path,type:'POST',data:payload}).then(function(r){if(r.code!==0){message(r.msg||'保存失败');return;}message('');load();},function(){message('保存失败，请检查登录状态或权限后重试');});}
function render(){var rows=groups(),total=0,done=0;$('#rows').empty();rows.forEach(function(r){total+=r.students.length;done+=r.done;var card=$('<section class="report-card">'),title=$('<div class="row-title">').append($('<h3>').text(r.row===0?'未分配座位':'第 '+r.row+' 排')).append($('<span class="muted">').text('已完成 '+r.done+' / '+r.students.length+' 人'));card.append(title);var list=$('<div class="students">');r.students.forEach(function(s){var complete=Number(s.completed)===1,box=$('<div>'),button=$('<button type="button" class="student">').toggleClass('done',complete).attr('aria-pressed',String(complete)).prop('disabled',!canEdit || Number(s.id)<0).append($('<span>').text(s.name)).append($('<small>').text(complete?'✓ 已完成':'未完成'));button.on('click',function(){button.prop('disabled',true);write('mark',{id:s.id,date:loadedDate,completed:complete?0:1}).always(function(){button.prop('disabled',false);});});box.append(button);if(canEdit && Number(s.id)>0){box.append($('<button type="button" class="btn btn-link btn-xs" style="display:block">').text('调整排号').on('click',function(){layer.prompt({title:'输入新排号（1—100）',value:String(s.rowNumber)},function(value,index){if(!/^\d+$/.test(value)||Number(value)<1||Number(value)>100){layer.msg('请输入1至100的整数');return;}layer.close(index);write('move',{id:s.id,row:value});});}));}list.append(box);});card.append(list);$('#rows').append(card);});$('#total').text(total);$('#done').text(done);$('#pending').text(total-done);$('#rate').text(total?Math.round(done*100/total)+'%':'—');if(!rows.length)$('#rows').append($('<div class="report-card empty">').text(data.length?'当前排没有学生':'所选日期暂无课堂练习记录，请在课堂练习记录中添加。'));if(!$('#chartCard').prop('hidden'))draw();}
function load(){var date=$('#date').val();if(!date){message('请选择日期');return;}var request=++sequence;message('正在加载…');$.getJSON(ctx+'system/classroom/report',{date:date}).done(function(r){if(request!==sequence)return;if(r.code!==0){message(r.msg||'无权查看报表');return;}loadedDate=date;localStorage.setItem('classroomDate',date);data=r.data||[];var selected=$('#rowFilter').val(),numbers={};data.forEach(function(s){numbers[s.rowNumber]=true;});$('#rowFilter').empty().append($('<option value="">').text('全部排'));Object.keys(numbers).sort(function(a,b){return a-b;}).forEach(function(n){$('#rowFilter').append($('<option>').val(n).text('第'+n+'排'));});$('#rowFilter').val(numbers[selected]?selected:'');message('');render();}).fail(function(){if(request===sequence)message('加载失败，请检查网络或登录状态后重试');});}
$('#filters').on('submit',function(e){e.preventDefault();load();});$('#date').on('change',function(){$('#rows').empty();$('#chartCard').prop('hidden',true);load();});$('#rowFilter').on('change',render);$('#chartButton').on('click',function(){$('#chartCard').prop('hidden',false);draw();});$('#addStudent').on('submit',function(e){e.preventDefault();var name=$('#name').val().trim();if(!name){message('请输入学生姓名');return;}var button=$(this).find('button');button.prop('disabled',true);write('students',{name:name,row:$('#seatRow').val(),date:$('#date').val()}).always(function(){button.prop('disabled',false);});});window.addEventListener('storage',function(e){if(e.key==='classroomDate' && e.newValue){$('#date').val(e.newValue);load();}});document.addEventListener('visibilitychange',function(){if(!document.hidden)load();});window.addEventListener('focus',load);setInterval(function(){if(!document.hidden)load();},15000);window.addEventListener('resize',function(){if(chart)chart.resize();});load();
})();
</script></body></html>
